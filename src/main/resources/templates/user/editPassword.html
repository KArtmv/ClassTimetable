<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Edit password</h2>
        <form th:action="@{'/' + ${path} + '/update/password'}" th:object="${changePasswordForm}" method="post">
            <div class="mb-3">
                <label for="oldPassword">Old password</label>
                <input type="password" class="form-control" th:field="*{oldPassword}" id="oldPassword"
                       placeholder="Enter old password.">
                <div th:if="${#fields.hasErrors('oldPassword')}"
                     class="alert alert-danger" role="alert"
                     th:errors="*{oldPassword}">Enter old password
                </div>
            </div>
            <div class="mb-3">
                <label for="password">Password:</label>
                <input type="password" class="form-control" th:field="*{password}" id="password"
                       placeholder="Enter password">
                <div th:if="${#fields.hasErrors('password')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{password}">Password is mandatory.
                </div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword">Confirm password:</label>
                <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword"
                       placeholder="Confirm password">
                <div th:if="${#fields.hasErrors('confirmPassword')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{confirmPassword}">Confirm password is mandatory.
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
