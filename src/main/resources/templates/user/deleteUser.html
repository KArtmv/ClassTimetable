<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete [[${user}]]</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container mb-3">
        <h1>Are you sure want to delete next user:</h1>
                <h3>First name:
                    <small class="text-body-secondary" th:text="${userNames.firstName}"/>
                </h3>
                <h3>Last name:
                    <small class="text-body-secondary" th:text="${userNames.lastName}"/>
                </h3>
        <form th:action="@{'/' + ${path} + '/delete'}" method="post">
            <input type="hidden" th:value="*{id}" name="userId"/>
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="/" class="btn btn-success">Go to home page</a>
        </form>
    </div>
</main>
</body>
</html>
