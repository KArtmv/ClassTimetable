<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Names</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Edit user name</h2>
        <form th:action="@{'/' + ${path} + '/update/names'}" th:object="${userNames}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label for="firstName">First name:</label>
                <input type="text" class="form-control" th:field="*{firstName}" id="firstName" placeholder="Enter first name">
                <div th:if="${#fields.hasErrors('firstName')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{firstName}">First name is mandatory.
                </div>
            </div>
            <div class="mb-3">
                <label for="lastName">Last name:</label>
                <input type="text" class="form-control" th:field="*{lastName}" id="lastName" placeholder="Enter last name">
                <div th:if="${#fields.hasErrors('lastName')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{lastName}">Last name is mandatory.
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
