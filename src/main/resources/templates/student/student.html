<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
            <h2>Students</h2>
            <table sec:authorize="hasRole('student')" class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">First name</th>
                    <th scope="col">Last name</th>
                    <th scope="col">Group</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <th scope="row" th:text="${student.id}"></th>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.getGroup.groupName}"></td>
                </tr>
                </tbody>
            </table>
            <table sec:authorize="hasAnyRole('admin', 'staff')" class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">First name</th>
                    <th scope="col">Last name</th>
                    <th scope="col">Group</th>
                    <th scope="col">Option</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <th scope="row" th:text="${student.id}"></th>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.getGroup.groupName}"></td>
                    <td>
                        <a th:href="@{'/student/details/' + ${student.id}}" class="btn btn-primary btn-sm">Details</a>
                        <a th:href="@{'/student/remove/' + ${student.id}}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
    </div>
    <div sec:authorize="hasAnyRole('admin', 'staff')">
        <a href="/student/addStudent" class="btn btn-primary position-fixed bottom-0 mb-4 end-0 me-4">Add New Student</a>
    </div>
</main>
</body>
</html>
