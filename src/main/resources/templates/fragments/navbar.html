<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<th:block th:fragment="navbar">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <nav class="navbar navbar-expand bg-body-tertiary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Class Timetable</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav" sec:authorize="isAuthenticated()">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{'/' + ${#authentication.authorities[0].authority.replaceAll('[^a-z]++', '')} + '/details'}">
                            My details
                        </a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="hasAnyRole('admin', 'staff')">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">
                            Option
                        </a>
                        <ul class="dropdown-menu">
                            <li><a th:href="@{/student}" class="dropdown-item">Student</a></li>
                            <li><a th:href="@{/teacher}" class="dropdown-item">Teacher</a></li>
                            <li><a sec:authorize="hasRole('admin')" th:href="@{/staff}" class="dropdown-item">Staff</a></li>
                            <li><a th:href="@{/lesson}" class="dropdown-item">Lesson</a></li>
                            <li><a th:href="@{/course}" class="dropdown-item">Course</a></li>
                            <li><a th:href="@{/group}" class="dropdown-item">Group</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
            <a sec:authorize="!isAuthenticated()" class="nav-link" href="/login">Log in</a>
            <a sec:authorize="isAuthenticated()" class="nav-link" href="/logout">Log out</a>
        </div>
    </nav>
</th:block>
</html>
