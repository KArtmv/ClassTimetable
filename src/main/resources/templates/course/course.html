<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container mb-3">
        <h2>Courses</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Course name</th>
                <th scope="col">Course description</th>
                <th scope="col">Options</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses}">
                <th scope="row" th:text="${course.id}"></th>
                <td th:text="${course.courseName}"></td>
                <td th:text="${course.courseDescription}"></td>
                <td>
                    <a th:href="@{'/course/edit/' + ${course.id}}" class="btn btn-primary">Edit</a>
                    <a th:href="@{'/course/delete/' + ${course.id}}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a href="/course/addCourse" class="btn btn-primary position-fixed bottom-0 mb-4 end-0 me-4">Add New Course</a>
</main>
</body>
</html>
