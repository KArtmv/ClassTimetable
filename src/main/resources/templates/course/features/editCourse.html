<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Update Course</h2>
        <form th:action="@{/course/update}" th:object="${course}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label for="courseName">Course name:</label>
                <input type="text" class="form-control" th:field="*{courseName}" id="courseName"
                       placeholder="Enter course name">
                <div th:if="${#fields.hasErrors('courseName')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{courseName}">Course name error
                </div>
            </div>
            <div class="mb-3">
                <label for="courseDescription">Course description:</label>
                <input type="text" class="form-control" th:field="*{courseDescription}" id="courseDescription"
                       placeholder="Enter course description">
                <div th:if="${#fields.hasErrors('courseDescription')}"
                     class="error p-1 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1"
                     th:errors="*{courseDescription}">Course description error
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/course" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
