<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Delete Course</h2>
        <form th:action="@{/course/remove}" th:object="${course}" method="post">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Course name</th>
                    <th scope="col">Course description</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <th th:text="${course.id}"></th>
                    <td th:text="${course.courseName}"></td>
                    <td th:text="${course.courseDescription}"></td>
                </tr>
                </tbody>
            </table>
            <input type="hidden" th:field="*{id}"/>
            <button type="submit" class="btn btn-primary">Delete</button>
            <a href="/course" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
