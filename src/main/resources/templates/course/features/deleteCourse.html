<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Are you sure you want to delete course:</h2>
        <h4>Name:
            <small class="text-body-secondary" th:text="${course.courseName}"/>
        </h4>
        <h4>Description:
            <small class="text-body-secondary" th:text="${course.courseDescription}"/>
        </h4>
        <form th:action="@{/course/remove}" th:object="${course}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="/course" class="btn btn-primary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
