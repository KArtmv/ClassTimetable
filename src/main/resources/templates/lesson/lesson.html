<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lessons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Lessons</h2>
        <div class="accordion" id="lessonAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Select Date
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#lessonAccordion">
                    <div class="accordion-body">
                        <form th:action="@{'/lesson' + ${lessonPerDayPath}}" method="get">
                            <label for="date">Date:</label>
                            <input type="date" id="date" name="date" th:value="${selectedDate}" class="form-control mb-3">
                            <button type="submit" class="btn btn-success">Find</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                        Select Date Range
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#lessonAccordion">
                    <div class="accordion-body">
                        <form th:action="@{'/lesson' + ${lessonByDatesPath}}" method="get">
                            <label for="start">Start date:</label>
                            <input type="date" id="start" name="start" th:value="${startDate}" class="form-control mb-3">
                            <label for="end">End date:</label>
                            <input type="date" id="end" name="end" th:value="${endDate}" class="form-control mb-3">
                            <button type="submit" class="btn btn-success">Find</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${classtables.isEmpty()}">
            <p class="alert alert-info mt-3">The lessons list is currently empty.</p>
        </div>
        <div th:if="${!classtables.isEmpty()}">
            <div th:each="classtable : ${classtables}">
                <p class="mt-4" th:text="${classtable.getKey()}"></p>
                <div class="row mb-4">
                    <div class="col-md-4 table-container" th:each="group, iterStat : ${classtable.getValue()}">
                        <table class="table table-striped table-bordered caption-top">
                            <caption>
                                <a th:text="${group.getKey().groupName}"
                                   th:href="@{'/group/details-' + ${group.getKey().id}}"></a>
                            </caption>
                            <thead>
                            <tr>
                                <th scope="col">Lesson</th>
                                <th scope="col">Course</th>
                                <th scope="col">Classroom</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="lesson : ${group.getValue()}">
                                <td>
                                    <a th:text="${lesson.lessonNum}" th:href="@{'/lesson/details-' + ${lesson.getId()}}"></a>
                                </td>
                                <td th:text="${lesson.course.courseName}"></td>
                                <td th:text="${lesson.classroom.classroomName}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
