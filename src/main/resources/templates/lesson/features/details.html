<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2 class="mb-3">Lesson</h2>
        <h3>Date:
            <small class="text-body-secondary" th:text="${lesson.date}"></small>
        </h3>
        <h3>Lesson num:
            <small class="text-body-secondary" th:text="${lesson.lessonNum}"></small>
        </h3>
        <h3>Course:
            <small class="text-body-secondary" th:text="${lesson.course.courseName}"></small><br>
            <small class="text-body-secondary ms-5" th:text="${'Description: ' + lesson.course.courseDescription}"></small>
        </h3>
        <h3>Group:
            <a class="text-body-secondary" th:text="${lesson.group.groupName}" th:href="@{'/group/details-' + ${lesson.group.id}}"></a>
        </h3>
        <h3>Teacher:
            <a class="text-body-secondary" th:text="${lesson.teacher.firstName} + ' ' + ${lesson.teacher.lastName}"
               th:href="@{'/teacher/details-' + ${lesson.teacher.id}}"></a>
        </h3>
        <h3>Classroom:
            <small class="text-body-secondary" th:text="${lesson.classroom.classroomName}"></small>
        </h3>
        <a class="mb-3" th:href="@{'/group/students-of-group-' + ${lesson.group.id}}">Participants</a>
        <a class="btn btn-success" th:href="@{'/lesson/edit-' + ${lesson.id}}">Edit</a>
        <a class="btn btn-primary" href="/lesson">Back</a>
    </div>
</main>
</body>
</html>
