<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Group</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container">
        <h2>Are you sure you want to delete group:
            <small class="text-body-secondary" th:text="${group.groupName}"/>?
        </h2>
        <form th:action="@{/group/remove}" th:object="${group}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <button type="submit" class="btn btn-primary">Delete</button>
            <a href="/group" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
