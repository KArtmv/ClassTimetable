<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Group</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container mb-3">
        <h1>Add New Group</h1>
        <h2>Save group with this name:
            <span class="text-body-secondary" th:text="${group.groupName}"></span>
        </h2>
        <form th:action="@{/group/save}" th:object="${group}" method="post">
            <input type="hidden" th:field="*{groupName}" id="groupNameField">
            <div th:if="${#fields.hasErrors('groupName')}"
                 class="error text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-3 text-center mt-1 mb-3"
                 th:errors="*{groupName}">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/group" class="btn btn-danger">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
