<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" th:rel="stylesheet"/>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
</head>
<body>
<main>
    <div class="container mb-3">
        <h2>Groups</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Group name</th>
                <th scope="col">Options</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="group : ${groups}">
                <th scope="row" th:text="${group.id}"></th>
                <td>
                    <a class="text-body-secondary" th:text="${group.groupName}"
                       th:href="@{'/group/details-' + ${group.id}}"></a>
                <td>
                    <a th:href="@{'/group/delete/' + ${group.id}}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a href="/group/addGroup" class="btn btn-primary position-fixed bottom-0 mb-4 end-0 me-4">Add New Group</a>
</main>
</body>
</html>
